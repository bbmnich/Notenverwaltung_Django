<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Grades - Grade Tracker</title>
    <style>
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-leiste {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 1px solid #2a2a35;
            padding-bottom: 15px;
        }

        .nav-leiste a {
            color: #8b8b9e;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-leiste a.aktiv {
            color: #ffffff;
        }

        .box {
            background-color: #16161e;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
        }

        p {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav-leiste">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'students' %}">Students</a>
            <a href="{% url 'courses' %}">Courses</a>
            <a href="{% url 'grades' %}" class="aktiv">Grades</a>
            <a href="{% url 'reports' %}">Reports</a>
            <a href="{% url 'admin_bereich' %}" style="color: #eb0879;">Admin</a>
        </div>
        <div class="box">
            <h1>Notenübersicht</h1>

            <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <thead>
                    <tr style="border-bottom: 2px solid #2a2a35;">
                        <th style="text-align: left; padding: 10px;">Student</th>
                        <th style="text-align: left; padding: 10px;">Kurs</th>
                        <th style="text-align: center; padding: 10px;">Note</th>
                    </tr>
                </thead>
                <tbody>
                    {% for grade in grades %}
                    <tr style="border-bottom: 1px solid #2a2a35;">
                        <td style="padding: 10px;">{{ grade.student.name }}</td>
                        <td style="padding: 10px;">{{ grade.course.name }}</td>
                        <td style="padding: 10px; text-align: center; font-weight: bold; color: #8b8b9e;">
                            {{ grade.score }}
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" style="padding: 20px; text-align: center; color: #8b8b9e;">
                            Noch keine Noten eingetragen.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
</body>

</html>
