<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Students - Grade Tracker</title>
    <style>
    body {
        background-color: #0b0b0f;
        color: #ffffff;
        font-family: Arial, sans-serif;
        font-size: 16px;
        margin: 0;
        padding: 40px;
    }
    .container {
        max-width: 1200px;
        margin: 0 auto;
    }
    .nav-leiste {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
        border-bottom: 1px solid #2a2a35;
        padding-bottom: 15px;
    }
    .nav-leiste a {
        color: #8b8b9e;
        text-decoration: none;
        font-weight: bold;
    }
    .nav-leiste a.aktiv {
        color: #ffffff;
    }
    .box {
        background-color: #16161e;
        border: 1px solid #2a2a35;
        border-radius: 12px;
        padding: 30px;
    }
    h1 {
        font-size: 24px;
        margin-top: 0;
    }
    p {
        font-size: 16px;
    }
</style>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <div class="nav-leiste">
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'students' %}" class="aktiv">Students</a>
    <a href="{% url 'courses' %}">Courses</a>
    <a href="{% url 'grades' %}">Grades</a>
    <a href="{% url 'reports' %}">Reports</a>
    <a href="{% url 'admin_bereich' %}" style="color: #eb0879;">Admin</a>
</div>

    
        <div class="box">
    <h1>Students</h1>
    
    <!-- Daten aus der Datenbank -->
    <ul style="list-style-type: none; padding: 0;">
        {% for student in students %}
            <li style="padding: 8px 0; border-bottom: 1px solid #2a2a35;">
                {{ student.name }} <span style="color: #8b8b9e; font-size: 14px;">({{ student.email }})</span>
            </li>
        {% empty %}
            <li style="color: #8b8b9e;">Noch keine Studenten vorhanden. Trage welche im Admin-Bereich ein!</li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
