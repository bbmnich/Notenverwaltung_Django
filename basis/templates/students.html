<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Students - Grade Tracker</title>
    <style>
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-leiste {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 1px solid #2a2a35;
            padding-bottom: 15px;
        }

        .nav-leiste a {
            color: #8b8b9e;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-leiste a.aktiv {
            color: #ffffff;
        }

        .box {
            background-color: #16161e;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
        }

        p {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Navigation -->
        <div class="nav-leiste">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'students' %}" class="aktiv">Students</a>
            <a href="{% url 'courses' %}">Courses</a>
            <a href="{% url 'grades' %}">Grades</a>
            <a href="{% url 'reports' %}">Reports</a>
            <a href="{% url 'admin_bereich' %}" style="color: #eb0879;">Admin</a>
        </div>


        <div class="box">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1 style="margin: 0;">Students</h1>
                <a href="{% url 'student_create' %}"
                    style="background-color: #eb0879; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-size: 14px;">+
                    Neuen Studenten anlegen</a>
            </div>

            <!-- Daten aus der Datenbank -->
            <ul style="list-style-type: none; padding: 0;">
                {% for student in students %}
                <li
                    style="padding: 12px 0; border-bottom: 1px solid #2a2a35; display: flex; justify-content: space-between; align-items: center;">
                    <span>{{ student.first_name }} {{ student.last_name }} <span
                            style="color: #8b8b9e; font-size: 14px;">({{ student.email }})</span></span>
                    <div>
                        <a href="{% url 'student_edit' student.pk %}"
                            style="color: #f0ad4e; text-decoration: none; margin-right: 15px; font-size: 14px;">Bearbeiten</a>
                        <a href="{% url 'student_delete' student.pk %}"
                            style="color: #d9534f; text-decoration: none; font-size: 14px;">Löschen</a>
                    </div>
                </li>
                {% empty %}
                <li style="color: #8b8b9e;">Noch keine Studenten vorhanden.</li>
                {% endfor %}
            </ul>
        </div>
</body>

</html>
