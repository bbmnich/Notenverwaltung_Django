<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Courses - Grade Tracker</title>
    <style>
        /*SEITEN-DESIGN*/
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* System-Haupttitel */
        .system-titel {
            font-size: 20px;
            color: #8b8b9e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* NAVIGATIONSSLEISTE */
        .nav-leiste {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 1px solid #2a2a35;
            padding-bottom: 15px;
        }

        .nav-leiste a {
            color: #8b8b9e;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-leiste a.aktiv {
            color: #ffffff;
        }

        /* HAUPTINHALT */
        .box {
            background-color: #16161e;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
        }

        p {
            font-size: 16px;
        }

        /* BUTTONS UND AKTIONEN */
        .btn-create {
            display: inline-block;
            background-color: #eb0879;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-create:hover {
            opacity: 0.9;
        }

        .course-actions a {
            margin-left: 15px;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-edit {
            color: #3b82f6;
        }

        .btn-delete {
            color: #eb0879;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- System-Titel -->
        <div class="system-titel">Notenverwaltung</div>

        <!-- Hauptmenü -->
        <div class="nav-leiste">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'students' %}">Students</a>
            <a href="{% url 'courses' %}" class="aktiv">Courses</a>
            <a href="{% url 'grades' %}">Grades</a>
            <a href="{% url 'reports' %}">Reports</a>
            <a href="{% url 'admin_bereich' %}" style="color: #eb0879;">Admin</a>
        </div>
        <!-- Bereich für Kurse -->
        <div class="box">
            <h1>Kurse</h1>

            <!-- Button, um einen neuen Kurs anzulegen -->
            <a href="{% url 'course_create' %}" class="btn-create">+ Neuen Kurs erstellen</a>

            <ul style="list-style-type: none; padding: 0;">
                {% for course in courses %}
                <li
                    style="padding: 12px 0; border-bottom: 1px solid #2a2a35; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>{{ course.name }}</strong>
                        <span style="color: #8b8b9e; font-size: 14px; margin-left: 10px;">(Max. Punkte: {{course.max_score }})</span>
                    </div>
                    <div class="course-actions">
                        <!-- Bearbeiten-Button -->
                        <a href="{% url 'course_edit' course.pk %}" class="btn-edit">Bearbeiten</a>
                        <!-- Löschen-Button -->
                        <a href="{% url 'course_delete' course.pk %}" class="btn-delete">Löschen</a>
                    </div>
                </li>
                {% empty %}

                <!-- Fall, falls noch keine Kurse existieren -->
                <li style="color: #8b8b9e;">Noch keine Kurse angelegt.</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>

</html>
