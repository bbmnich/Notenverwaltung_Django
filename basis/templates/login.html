<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Login - Grade Tracker</title>
    <style>
        body { background-color: #0b0b0f; color: #ffffff; font-family: Arial, sans-serif; padding: 40px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background-color: #16161e; border: 1px solid #2a2a35; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; background-color: #0b0b0f; border: 1px solid #2a2a35; color: #fff; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        button { background-color: #eb0879; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        label { color: #8b8b9e; font-size: 14px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h1 style="font-size: 22px; margin-top: 0; margin-bottom: 20px;">Anmelden</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Einloggen</button>
        </form>
    </div>
</body>
</html>
