<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Neuen Studenten anlegen</title>

</head>

<body style="background-color: #121212; color: #ffffff; font-family: sans-serif; padding: 20px;">

    <div class="container">
        <h1>Neuen Studenten anlegen</h1>

        <!-- Das Formular -->
        <form method="POST">
            {% csrf_token %} <!-- Wichtig für die Sicherheit des Formulars -->
            {{ form.as_p }} <!-- Zeigt die Eingabefelder an -->

            <button type="submit"
                style="padding: 10px 20px; background-color: #eb0879; color: white; border: none; cursor: pointer;">
                Student speichern
            </button>
        </form>

        <br>
        <a href="{% url 'dashboard' %}" style="color: #eb0879;">Zurück zum Dashboard</a>
    </div>

</body>

</html>
