<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Notenverwaltung</title>
    <style>
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-leiste {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            border-bottom: 1px solid #2a2a35;
            padding-bottom: 15px;
        }

        .nav-leiste a {
            color: #8b8b9e;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-leiste a.aktiv {
            color: #ffffff;
        }

        .box {
            background-color: #16161e;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
        }

        p {
            font-size: 16px;
        }

        /*Export-Button */
        .btn-export {
            background-color: #eb0879;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            display: inline-block;
            margin-top: 30px;
        }

        .btn-export:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Hauptmenü -->
        <div class="nav-leiste">
            <a href="{% url 'dashboard' %}" class="aktiv">Dashboard</a>
            <a href="{% url 'students' %}">Students</a>
            <a href="{% url 'courses' %}">Courses</a>
            <a href="{% url 'grades' %}">Grades</a>
            <a href="{% url 'reports' %}">Reports</a>
            <a href="{% url 'admin_bereich' %}" style="color: #eb0879;">Admin</a>
        </div>


        <div class="box">
            <h1>Dashboard</h1>
            <p style="color: #8b8b9e; margin-bottom: 25px;">Willkommen in deiner Notenverwaltung!</p>


            <div style="display: flex; gap: 20px; margin-top: 20px;">

                <!-- Karte 1: Studenten-Zähler -->
                <div
                    style="background: #0b0b0f; border: 1px solid #2a2a35; padding: 20px; border-radius: 8px; flex: 1;">
                    <h3 style="margin: 0; color: #8b8b9e; font-size: 14px;">Studenten</h3>
                    <p style="font-size: 28px; font-weight: bold; margin: 10px 0 0 0;">{{ student_count }}</p>
                </div>

                <!-- Karte 2: Kurse-Zähler -->
                <div
                    style="background: #0b0b0f; border: 1px solid #2a2a35; padding: 20px; border-radius: 8px; flex: 1;">
                    <h3 style="margin: 0; color: #8b8b9e; font-size: 14px;">Kurse</h3>
                    <p style="font-size: 28px; font-weight: bold; margin: 10px 0 0 0;">{{ course_count }}</p>
                </div>

                <!-- Karte 3: Noten-Zähler -->
                <div
                    style="background: #0b0b0f; border: 1px solid #2a2a35; padding: 20px; border-radius: 8px; flex: 1;">
                    <h3 style="margin: 0; color: #8b8b9e; font-size: 14px;">Eingetragene Noten</h3>
                    <p style="font-size: 28px; font-weight: bold; margin: 10px 0 0 0;">{{ grade_count }}</p>
                </div>

            </div>

            <!-- Buttons für den Datei Export und Import -->
            <div style="margin-top: 30px; display: flex; gap: 15px; align-items: center;">

                <!-- Export-Button -->
                <a href="{% url 'export_grades_csv' %}" class="btn-export">⬇️ Noten als Excel exportieren</a>

                <!-- Import-Formular mit direktem Datei-Dialog -->
                <form method="post" action="{% url 'import_grades_csv' %}" enctype="multipart/form-data"
                    style="display: inline; margin: 0;">
                    {% csrf_token %}
                    <!-- Unsichtbares Datei-Input -->
                    <input type="file" id="csvFileInput" name="csv_file" accept=".csv" style="display: none;"
                        onchange="this.form.submit()">

                    <!-- Der Import-Button, Datei-Fenster öffnen -->
                    <button type="button" onclick="document.getElementById('csvFileInput').click()" class="btn-export"
                        style="background-color: #3d12e6; border: none; cursor: pointer;">
                        ⬆️ Noten importieren
                    </button>
                </form>

            </div>

        </div> <!-- Ende der .box -->
    </div> <!-- Ende des .container -->
</body>

</html>
