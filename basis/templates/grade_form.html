<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Note verwalten - Grade Tracker</title>
    <style>
        /*Layout */
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .box {
            background-color: #16161e;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Formular-Felder und Dropdowns */
        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            color: #8b8b9e;
            font-weight: bold;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 10px;
            background-color: #0b0b0f;
            border: 1px solid #2a2a35;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* Speichern-Button */
        .btn-save {
            background-color: #eb0879;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        /* Abbrechen-Link */
        .btn-cancel {
            color: #8b8b9e;
            text-decoration: none;
            margin-left: 15px;
            font-size: 16px;
        }

        .btn-cancel:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <!-- Überschrift: Je nachdem ob Note bearbeitet oder neu erstellt wird -->
            <h1>{% if grade %}Note bearbeiten{% else %}Neue Note erfassen{% endif %}</h1>

            <!-- Formular zum Eintragen/Ändern der Noten -->
            <form method="post">
                <!-- Sicherheits-Token von Django -->
                {% csrf_token %}

                <!-- Gibt die Formularfelder (Student, Kurs, Note) als Absätze aus -->
                {{ form.as_p }}

                <div style="margin-top: 25px;">
                    <!-- Button zum Speichern -->
                    <button type="submit" class="btn-save">Speichern</button>
                    <!-- Zurück zur Notenübersicht -->
                    <a href="{% url 'grades' %}" class="btn-cancel">Abbrechen</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
